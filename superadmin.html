<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Eazy Fotobooth</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-6 text-slate-900 selection:bg-blue-200">

    <div class="bg-white p-8 sm:p-10 rounded-3xl w-full max-w-md shadow-2xl relative overflow-hidden">
        <!-- Top decorative border -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>
        
        <div class="text-center mb-8 mt-2">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 border border-blue-100 shadow-sm">
                <i class="ph ph-crown font-black"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-slate-900">Portal Super Admin</h1>
            <p class="text-xs font-medium text-slate-500 mt-1">Daftarkan akun vendor/klien baru untuk memberikan mereka akses ke web Photobooth.</p>
        </div>

        <div class="flex flex-col gap-4">
            <!-- Master Code -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <label class="text-[10px] font-black uppercase tracking-wider text-slate-700 block mb-1.5 flex items-center gap-1">
                    <i class="ph ph-key text-blue-600"></i> Kode Rahasia Admin
                </label>
                <input type="password" id="saMasterCode" placeholder="Masukkan kode master" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-blue-500 transition" />
            </div>

            <!-- Client Credentials -->
            <div class="mt-2">
                <label class="text-xs font-bold text-slate-700 block mb-1.5">Email Klien Baru</label>
                <input type="email" id="saEmail" placeholder="klien1@fotobooth.id" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 transition shadow-sm" />
            </div>
            
            <div>
                <label class="text-xs font-bold text-slate-700 block mb-1.5">Password Klien</label>
                <input type="text" id="saPassword" placeholder="Minimal 6 karakter" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-500 transition shadow-sm" />
            </div>
            
            <div id="saMessage" class="hidden text-xs font-bold p-3 rounded-xl text-center mt-2"></div>
        </div>

        <button id="btnCreateAccount" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-4 rounded-xl mt-6 transition shadow-md flex items-center justify-center gap-2">
            <i class="ph ph-user-plus text-lg"></i> DAFTARKAN KLIEN
        </button>
        
        <div class="text-center mt-6">
            <a href="app.html" class="text-xs font-bold text-slate-500 hover:text-blue-600 transition flex items-center justify-center gap-1">
                <i class="ph ph-arrow-left"></i> Kembali ke Photobooth
            </a>
        </div>
    </div>

    <script>
        // Default Supabase Configuration (dari auth.js)
        const sUrl = 'https://mnwvelmekcddrpdlokhx.supabase.co';
        const sKey = 'sb_publishable_cNLRLQ2Pu41v80JQDg3QTA_pcmQ6pvM';
        const supabaseClient = supabase.createClient(sUrl, sKey);

        // SECRET MASTER CODE
        const MASTER_CODE = 'BOS123';

        document.getElementById('btnCreateAccount').addEventListener('click', async () => {
            const masterCode = document.getElementById('saMasterCode').value;
            const email = document.getElementById('saEmail').value.trim();
            const password = document.getElementById('saPassword').value.trim();
            const msgEl = document.getElementById('saMessage');
            const btn = document.getElementById('btnCreateAccount');

            // Reset Message
            msgEl.className = 'hidden text-xs font-bold p-3 rounded-xl text-center mt-2';
            msgEl.innerHTML = '';

            // Validations
            if (masterCode !== MASTER_CODE) {
                msgEl.innerHTML = '<i class="ph ph-warning-circle"></i> Kode Rahasia Admin Salah!';
                msgEl.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-100');
                msgEl.classList.remove('hidden');
                return;
            }

            if (!email || !password || password.length < 6) {
                msgEl.innerHTML = '<i class="ph ph-warning-circle"></i> Email wajib diisi dan Password minimal 6 karakter.';
                msgEl.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-100');
                msgEl.classList.remove('hidden');
                return;
            }

            // Loading state
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Mendaftarkan...';
            btn.disabled = true;

            try {
                // Register user to Supabase
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw error;
                }

                // If successful
                msgEl.innerHTML = `<i class="ph ph-check-circle text-lg"></i><br>Berhasil! Akun <b>${email}</b> telah dibuat.<br><span class="font-medium text-[10px]">Klien sudah bisa login di app.html</span>`;
                msgEl.classList.add('bg-emerald-50', 'text-emerald-700', 'border', 'border-emerald-100');
                msgEl.classList.remove('hidden');
                
                // Clear form
                document.getElementById('saEmail').value = '';
                document.getElementById('saPassword').value = '';
                
                // Sign out immediately so Super Admin doesn't get logged in as the client
                await supabaseClient.auth.signOut();

            } catch (err) {
                msgEl.innerHTML = `<i class="ph ph-warning-circle"></i> Gagal: ${err.message}`;
                msgEl.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-100');
                msgEl.classList.remove('hidden');
            } finally {
                btn.innerHTML = origHtml;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
